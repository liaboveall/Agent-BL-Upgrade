name: CI

on:
  push:
    branches: [main, 'feat/**', 'codex/**']
  pull_request:
  schedule:
    # Weekly: surfaces new dependency advisories even when the code did not change.
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    name: Desktop browser regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: desktop-browser-evidence
          path: test-results/

  app:
    name: App · Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          # Windows catches line-ending and path assumptions (the vendored bundles are
          # integrity-checked byte for byte).
          - { os: windows-latest, node: 22 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      # The server serves the built React dashboard from dist/.
      - run: npm run build
      - name: Tests with coverage thresholds
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run test:coverage
      - name: Tests
        if: matrix.os != 'ubuntu-latest' || matrix.node != 24
        run: npm test

  w2-capital:
    name: W2 capital lifecycle · real EVM and HTTP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            hardhat/package-lock.json
      - run: npm ci
      - run: npm --prefix hardhat ci
      - run: npm run test:w2

  w3-rights:
    name: W3 rights controls · real EVM and business sessions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            hardhat/package-lock.json
      - run: npm ci
      - run: npm --prefix hardhat ci
      - run: npm run test:w3

  w4-evidence:
    name: W4 evidence and provenance · actual ERC-3009 and anchor EVM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            hardhat/package-lock.json
      - run: npm ci
      - run: npm --prefix hardhat ci
      - run: npm run test:w4
      - run: npm run eval:w4

  w5-operations:
    name: W5 operations and isolated recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix hardhat ci
      - run: npm run test:w5
      - run: npm run build
      - run: npm run load:w5 -- --soak-seconds 600 --output test-results/w5-load.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: w5-operations-evidence
          path: test-results/

  reproducible:
    name: Clean reproducible web and contract build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            hardhat/package-lock.json
      - run: npm ci
      - run: npm --prefix hardhat ci
      - run: npm run compile:contracts
      - run: npm run build:clean -- test-results/clean-build
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: clean-build-evidence
          path: test-results/clean-build/

  document-node20:
    name: Document extraction · Node 20.11.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.11.1
          cache: npm
      # ESLint has a newer runtime requirement; the parser's compatibility promise is separate.
      - run: npm ci --ignore-scripts
      - run: node --test tests/documentExtraction.test.js

  contracts:
    name: Contracts · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: hardhat
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            hardhat/package-lock.json
      - run: npm ci
      - name: Install application dependencies for shared proof verification
        run: npm --prefix .. ci --omit=dev --ignore-scripts
      - run: npm test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build --build-arg RELEASE_REVISION=${{ github.sha }} -t agentbl:ci .
      - name: Start with the hardened runtime options and wait for the healthcheck
        run: |
          docker run -d --name agentbl -p 127.0.0.1:3000:3000 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -v agentbl-runtime:/app/data/runtime agentbl:ci
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' agentbl)
            if [ "$status" = healthy ]; then exit 0; fi
            sleep 2
          done
          docker logs agentbl
          exit 1
      - name: Smoke the running container
        run: |
          curl --fail --silent http://127.0.0.1:3000/api/health
          curl --fail --silent --output /dev/null http://127.0.0.1:3000/
          test "$(docker exec agentbl id -u)" = 1000

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # A controlled release requires both production and contract toolchain audits.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=high
      - run: npm --prefix hardhat audit --audit-level=high

  offhost-recovery:
    name: W5 independent host recovery
    if: github.event_name == 'push' && vars.AGENTBL_W5_RECOVERY_COMMIT != '' && github.sha == vars.AGENTBL_W5_RECOVERY_COMMIT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reassemble the encrypted snapshot and separate temporary key files
        env:
          W5_BACKUP_KEY: ${{ secrets.AGENTBL_W5_RECOVERY_BACKUP_KEY }}
          W5_VAULT_KEY: ${{ secrets.AGENTBL_W5_RECOVERY_VAULT_KEY }}
          W5_PAYLOAD_0: ${{ secrets.AGENTBL_W5_RECOVERY_PAYLOAD_0 }}
          W5_PAYLOAD_1: ${{ secrets.AGENTBL_W5_RECOVERY_PAYLOAD_1 }}
          W5_PAYLOAD_2: ${{ secrets.AGENTBL_W5_RECOVERY_PAYLOAD_2 }}
          W5_PAYLOAD_3: ${{ secrets.AGENTBL_W5_RECOVERY_PAYLOAD_3 }}
          W5_PAYLOAD_4: ${{ secrets.AGENTBL_W5_RECOVERY_PAYLOAD_4 }}
          W5_PAYLOAD_5: ${{ secrets.AGENTBL_W5_RECOVERY_PAYLOAD_5 }}
          W5_PAYLOAD_6: ${{ secrets.AGENTBL_W5_RECOVERY_PAYLOAD_6 }}
          W5_PAYLOAD_7: ${{ secrets.AGENTBL_W5_RECOVERY_PAYLOAD_7 }}
          W5_PAYLOAD_8: ${{ secrets.AGENTBL_W5_RECOVERY_PAYLOAD_8 }}
          W5_PAYLOAD_9: ${{ secrets.AGENTBL_W5_RECOVERY_PAYLOAD_9 }}
          W5_PAYLOAD_10: ${{ secrets.AGENTBL_W5_RECOVERY_PAYLOAD_10 }}
          W5_PAYLOAD_11: ${{ secrets.AGENTBL_W5_RECOVERY_PAYLOAD_11 }}
          W5_PAYLOAD_12: ${{ secrets.AGENTBL_W5_RECOVERY_PAYLOAD_12 }}
          W5_PAYLOAD_13: ${{ secrets.AGENTBL_W5_RECOVERY_PAYLOAD_13 }}
          W5_PAYLOAD_14: ${{ secrets.AGENTBL_W5_RECOVERY_PAYLOAD_14 }}
          W5_PAYLOAD_15: ${{ secrets.AGENTBL_W5_RECOVERY_PAYLOAD_15 }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const dir = `${process.env.RUNNER_TEMP}/w5-recovery`;
          await fs.mkdir(dir, { recursive: true });
          for (const name of ['W5_BACKUP_KEY', 'W5_VAULT_KEY']) if (!/^[a-f0-9]{64}$/.test(process.env[name] ?? '')) throw new Error('Temporary recovery key missing');
          const payload = Array.from({ length: 16 }, (_, i) => process.env[`W5_PAYLOAD_${i}`] ?? '').join('');
          const data = Buffer.from(payload, 'base64');
          if (JSON.parse(data).schema !== 'agentbl-encrypted-runtime-backup-v1') throw new Error('Encrypted snapshot missing');
          await fs.writeFile(`${dir}/backup.json`, data, { mode: 0o600 });
          await fs.writeFile(`${dir}/backup-key.hex`, process.env.W5_BACKUP_KEY, { mode: 0o600 });
          await fs.writeFile(`${dir}/rights-key.hex`, process.env.W5_VAULT_KEY, { mode: 0o600 });
          NODE
      - run: docker build --build-arg RELEASE_REVISION=${{ github.sha }} -t agentbl:recovery .
      - name: Restore with source host unavailable, verify evidence and reconcile actual testnet positions
        run: |
          mkdir -p test-results/offhost-recovery
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$RUNNER_TEMP/w5-recovery/backup.json,dst=/restore/backup.json,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/w5-recovery/backup-key.hex,dst=/run/secrets/backup-key.hex,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/w5-recovery/rights-key.hex,dst=/run/secrets/rights-key.hex,readonly" \
            agentbl:recovery node scripts/lib/w5-container-recovery.mjs > test-results/offhost-recovery/receipt.json
          node -e "const r=require('./test-results/offhost-recovery/receipt.json');if(!r.passed||r.snapshot_source_revision!==process.env.GITHUB_SHA||r.source_runtime_mounted||r.broadcasts!==0)process.exit(1)"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: w5-independent-host-recovery
          path: test-results/offhost-recovery/
      - name: Remove runner-local recovery files
        if: always()
        run: rm -rf "$RUNNER_TEMP/w5-recovery"
