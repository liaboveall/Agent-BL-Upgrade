name: CI

on:
  push:
    branches: [main, 'feat/**', 'codex/**']
  pull_request:
  schedule:
    # Weekly: surfaces new dependency advisories even when the code did not change.
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    name: Desktop browser regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: desktop-browser-evidence
          path: test-results/

  app:
    name: App · Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          # Windows catches line-ending and path assumptions (the vendored bundles are
          # integrity-checked byte for byte).
          - { os: windows-latest, node: 22 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      # The server serves the built React dashboard from dist/.
      - run: npm run build
      - name: Tests with coverage thresholds
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run test:coverage
      - name: Tests
        if: matrix.os != 'ubuntu-latest' || matrix.node != 24
        run: npm test

  capital:
    name: Capital lifecycle · real EVM and HTTP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            hardhat/package-lock.json
      - run: npm ci
      - run: npm --prefix hardhat ci
      - run: npm run test:capital

  rights:
    name: Rights controls · real EVM and business sessions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            hardhat/package-lock.json
      - run: npm ci
      - run: npm --prefix hardhat ci
      - run: npm run test:rights

  evidence:
    name: Evidence and provenance · actual ERC-3009 and anchor EVM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            hardhat/package-lock.json
      - run: npm ci
      - run: npm --prefix hardhat ci
      - run: npm run test:evidence
      - run: npm run eval:providers

  financing-workflow:
    name: Financing roles and 25 pools · real EVM and HTTP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            hardhat/package-lock.json
      - run: npm ci
      - run: npm --prefix hardhat ci
      - run: npm run test:finance
        env:
          AGENTBL_N3_EVIDENCE: test-results/n3
      - run: node --test tests/n5Deployment.integration.js
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: financing-workflow-evidence
          path: test-results/n3/

  operations:
    name: Operations and local recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix hardhat ci
      - run: npm run test:operations
      - run: npm run build
      - run: npm run test:load -- --soak-seconds 600 --output test-results/w5-load.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: operations-evidence
          path: test-results/

  reproducible:
    name: Clean reproducible web and contract build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            hardhat/package-lock.json
      - run: npm ci
      - run: npm --prefix hardhat ci
      - run: npm run compile:contracts
      - run: npm run build:clean -- test-results/clean-build
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: clean-build-evidence
          path: test-results/clean-build/

  document-node20:
    name: Document extraction · Node 20.11.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.11.1
          cache: npm
      # ESLint has a newer runtime requirement; the parser's compatibility promise is separate.
      - run: npm ci --ignore-scripts
      - run: node --test tests/documentExtraction.test.js

  contracts:
    name: Contracts · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: hardhat
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            hardhat/package-lock.json
      - run: npm ci
      - name: Install application dependencies for shared proof verification
        run: npm --prefix .. ci --omit=dev --ignore-scripts
      - run: npm test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build --build-arg RELEASE_REVISION=${{ github.sha }} -t agentbl:ci .
      - name: Start with the hardened runtime options and wait for the healthcheck
        run: |
          docker run -d --name agentbl -p 127.0.0.1:3000:3000 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -v agentbl-runtime:/app/data/runtime agentbl:ci
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' agentbl)
            if [ "$status" = healthy ]; then exit 0; fi
            sleep 2
          done
          docker logs agentbl
          exit 1
      - name: Smoke the running container
        run: |
          curl --fail --silent http://127.0.0.1:3000/api/health
          curl --fail --silent --output /dev/null http://127.0.0.1:3000/
          test "$(docker exec agentbl id -u)" = 1000

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # A controlled release requires both production and contract toolchain audits.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=high
      - run: npm --prefix hardhat audit --audit-level=high
