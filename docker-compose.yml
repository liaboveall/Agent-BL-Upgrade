services:
  agentbl:
    build:
      context: .
      args:
        RELEASE_REVISION: ${AGENTBL_RELEASE_REVISION:-UNRECORDED}
    image: agentbl:local
    ports:
      # Loopback only. To serve it publicly, put a reverse proxy (nginx, Caddy) with TLS in
      # front instead of publishing the port; see docs/operations.md.
      - "127.0.0.1:${AGENTBL_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      AGENTBL_RUNTIME_DIR: /app/data/runtime
      AGENTBL_RELEASE_REVISION: ${AGENTBL_RELEASE_REVISION:-UNRECORDED}
    volumes:
      # Receipts, cached reports, decision logs and Mystery reveals survive restarts.
      - agentbl-runtime:/app/data/runtime
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  agentbl-runtime:
